name: Cucumber Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Create environment file required by the framework
      - name: Create test environment file
        run: |
          mkdir -p config
          echo "BASE_URL=https://www.saucedemo.com" > config/env.test
          echo "USERNAME=standard_user" >> config/env.test
          echo "PASSWORD=secret_sauce" >> config/env.test

      - name: Run Cucumber tests
        run: npm run cucumber

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run cucumber:report

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.html
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots/
          retention-days: 30